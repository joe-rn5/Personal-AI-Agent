<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Agent — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <p class="page__eyebrow">personal agent — local demo</p>
    <h1 class="page__title">Talk to the agent</h1>
    <p class="subtitle">
    Welcome to my digital portfolio! <br><br>   Ask my AI assistant anything about my computer engineering background, skills, and projects.
</p>

    <section id="agent-widget" class="agent-widget">
      <header class="agent-widget__header">
        <span class="agent-widget__status" aria-hidden="true"></span>
        <span class="agent-widget__label">agent // <span id="agent-name">YOUSSEF RAMADAN</span></span>
      </header>

      <div class="agent-widget__log" id="chat-log" role="log" aria-live="polite">
        <div class="msg msg-assistant">
          <div class="msg__meta">&gt;&gt; agent</div>
          <div class="msg__text">Ask me about the projects, skills, or background behind this site.</div>
        </div>
      </div>

      <form class="agent-widget__form" id="chat-form">
        <input
          id="chat-input"
          class="agent-widget__input"
          type="text"
          placeholder="Ask something…"
          autocomplete="off"
        />
        <button type="submit" class="agent-widget__send">Send</button>
      </form>
    </section>
  </main>

  <script src="chat.js"></script>
</body>
</html>
